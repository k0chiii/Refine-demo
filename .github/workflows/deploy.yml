# CD
# - デモ版: CI が成功したあとにだけ配る（workflow_run）。Secrets が無いあいだは飛ばす。
# - 本番: 手で起動し、Environment production の承認後。配る前にその SHA で CI が成功していることを確かめる。
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: 配る先
        type: choice
        options: [demo, production]
        default: demo
      seed_notation:
        description: 本番に表記ルールの初期データ（デモ版と同じ）を入れる。既にある ruleId は飛ばす
        type: boolean
        default: false
      fb_migration:
        description: >-
          FB（フィードバック）をコメントへ移す。配り終えてから Convex の内部関数 feedbackMigration:run を流し、結果を実行のまとめに出す。
          dry-run=件数を数えるだけ（何も書かない）、migrate=コメントへ移す（何度流しても増えない）、
          delete=移行済みを確かめてから FB の行を全て消す（移っていないスレッドがあれば何も消さない）。
          順番は dry-run → migrate → delete。none は何もしない
        type: choice
        options: [none, dry-run, migrate, delete]
        default: none

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref }}-${{ inputs.target || 'demo' }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  actions: read
  checks: read

jobs:
  demo:
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'demo')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Cloudflare の設定が無ければ飛ばす
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定なので、デモ版は配りません"
      - name: 手動デモ配布でも CI verify が success であること
        if: env.HAS_CLOUDFLARE == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name=="verify")] | sort_by(.completed_at) | reverse | .[0].conclusion // empty')"
          echo "verify conclusion=${conclusion:-missing}"
          if [ "$conclusion" != "success" ]; then
            echo "::error::SHA ${sha} の CI ジョブ verify が success ではありません（${conclusion:-missing}）。デモは配りません。"
            exit 1
          fi
      - uses: actions/checkout@v5
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: voidzero-dev/setup-vp@56918a6d0c629c55ae8b88826a7d47fda85769ee # v1.9.0
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          version: "1.2.0"
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - name: デモ版をビルド
        if: env.HAS_CLOUDFLARE == 'true'
        run: pnpm --filter @mf100/web build:demo
      - name: Cloudflare Pages へ配る（main は本番、それ以外はブランチごとのプレビュー）
        if: env.HAS_CLOUDFLARE == 'true'
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || (github.event_name == 'pull_request' && github.head_ref || 'main') }}
        run: pnpm exec wrangler pages deploy ../web/dist-demo --project-name mf100-refine-demo --branch "$BRANCH" --commit-dirty=true

  production:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: この SHA で CI が成功していること
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          # 必須チェック名 verify（集約ジョブ）が success であること
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name=="verify")] | sort_by(.completed_at) | reverse | .[0].conclusion // empty')"
          echo "verify conclusion=${conclusion:-missing}"
          if [ "$conclusion" != "success" ]; then
            echo "::error::SHA ${sha} の CI ジョブ verify が success ではありません（${conclusion:-missing}）。本番は配りません。"
            exit 1
          fi
      - uses: voidzero-dev/setup-vp@56918a6d0c629c55ae8b88826a7d47fda85769ee # v1.9.0
        with:
          version: "1.2.0"
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - name: 確認（型・単体テスト）
        run: |
          pnpm build
          pnpm typecheck
          pnpm test
      - name: 配信する版の記録
        run: node scripts/release-manifest.mjs production
      - name: Convex を配り、その URL で Web をビルド
        working-directory: apps/convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: pnpm exec convex deploy --cmd "pnpm --filter @mf100/web build" --cmd-url-env-var-name VITE_CONVEX_URL
      - name: Workers（ファイルの提出と配信）を配る
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --config wrangler.jsonc --env production | tee ../../.logs/worker-deploy.log
          node ../../scripts/record-deployment.mjs worker "../../.logs/releases/production-${GITHUB_SHA}.json" ../../.logs/worker-deploy.log
      - name: Web を Cloudflare Pages へ配る
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm exec wrangler pages deploy ../web/dist --project-name mf100-refine --branch main --commit-hash "$GITHUB_SHA" | tee ../../.logs/pages-deploy.log
          node ../../scripts/record-deployment.mjs pages "../../.logs/releases/production-${GITHUB_SHA}.json" ../../.logs/pages-deploy.log
      - name: 配信版の対応を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.sha }}
          path: .logs/releases/
          if-no-files-found: ignore
          retention-days: 90
      - name: 表記ルールの初期データを入れる（指定したときだけ。配り終えてから流すので、失敗しても配る処理は止まらない）
        if: inputs.seed_notation
        working-directory: apps/convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: pnpm exec convex run notationSeed:importSamples
      - name: FB のコメントへの移行（指定したときだけ。配り終えてから流すので、失敗しても配る処理は止まらない。内部関数をデプロイキーで呼ぶ）
        if: inputs.fb_migration != 'none'
        working-directory: apps/convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          FB_MIGRATION: ${{ inputs.fb_migration }}
        run: |
          set -euo pipefail
          pnpm exec convex run feedbackMigration:run "{\"mode\":\"${FB_MIGRATION}\"}" | tee "$RUNNER_TEMP/fb-migration.json"
          {
            echo "### FB のコメントへの移行（${FB_MIGRATION}）"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/fb-migration.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
