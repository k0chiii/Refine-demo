<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>MF100 校正システム — 使い方（モーショングラフィックス）</title>
    <!--
  使い方の紹介動画のコンポジション。すべての動きは時刻 t（秒）の純関数で、window.__seek(t) で任意のフレームへ
  飛べる（render.mjs が 1 フレームずつ撮って ffmpeg へ渡す）。ブラウザで開くと ?play で再生、?t=12.5 でその時刻の静止画。
  画面の素材は e2e/screenshots.mjs の出力（e2e/out/screenshots/*.png。git 管理外）。
-->
    <link rel="stylesheet" href="../../node_modules/@fontsource-variable/noto-sans-jp/index.css" />
    <link
      rel="stylesheet"
      href="../../node_modules/@fontsource-variable/material-symbols-outlined/full.css"
    />
    <style>
      :root {
        --primary: #1b5fb4;
        --primary-dim: #0f4a94;
        --on-primary: #ffffff;
        --primary-container: #d7e3ff;
        --on-primary-container: #001b3f;
        --primary-fixed-dim: #a9c7ff;
        --surface: #f8f9ff;
        --surface-low: #f1f3fb;
        --surface-container: #e9ecf5;
        --surface-high: #e1e5ee;
        --on-surface: #191c20;
        --on-surface-variant: #44474f;
        --outline: #74777f;
        --outline-variant: #c4c6d0;
        --navy: #061329;
        --navy-2: #0b2047;
        --ok: #1d7a4a;
        --ok-container: #cdeedb;
        --warn: #8a5a00;
        --warn-container: #ffe3b3;
        --err: #ba1a1a;
        --err-container: #ffdad6;
      }
      html,
      body {
        margin: 0;
        background: #000;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: "Noto Sans JP Variable", "Noto Sans JP", sans-serif;
        color: var(--on-surface);
        background: var(--navy);
        -webkit-font-smoothing: antialiased;
        font-feature-settings: "palt";
      }
      .scene {
        position: absolute;
        inset: 0;
        visibility: hidden;
        will-change: transform, opacity;
      }
      .abs {
        position: absolute;
      }
      .ic {
        font-family: "Material Symbols Outlined Variable";
        font-weight: normal;
        font-style: normal;
        line-height: 1;
        letter-spacing: normal;
        display: inline-block;
        white-space: nowrap;
        direction: ltr;
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 48;
      }
      .ic.fill {
        font-variation-settings:
          "FILL" 1,
          "wght" 500,
          "GRAD" 0,
          "opsz" 48;
      }
      .mask {
        overflow: hidden;
        display: inline-block;
        vertical-align: top;
      }
      .ch {
        display: inline-block;
        will-change: transform, opacity;
      }

      /* 背景 */
      .bg {
        position: absolute;
        inset: 0;
      }
      .blob {
        position: absolute;
        border-radius: 50%;

      }

      /* 共通の見出し（STEP） */
      .step {
        position: absolute;
        left: 96px;

        display: flex;
        align-items: flex-end;
        gap: 28px;
      }
      .step .num {
        font-size: 132px;

        letter-spacing: -0.04em;

      }
      .step .ttl {
        padding-bottom: 10px;
      }
      .step .kicker {
        font-size: 20px;
        font-weight: 500;
        letter-spacing: 0.32em;
        color: var(--primary);
        text-transform: uppercase;

      .step .name {
        font-size: 56px;

      /* 画面（ブラウザ風の窓） */
      .win {
        position: absolute;
        background: #fff;
        border-radius: 22px;
        overflow: hidden;
        box-shadow:
          0 30px 80px rgba(6, 19, 41, 0.22),

      .win .bar {
        height: 36px;

      .win .bar i {
        width: 11px;

      }
      .win .bar .url {
        margin-left: 18px;

        flex: 0 0 360px;
        font-size: 12px;
        color: var(--outline);
        display: flex;
        align-items: center;
        justify-content: center;

      .win .view {

      .win .cont {

      .win .cont img {

      /* コールアウト（画像座標に置く） */
      .co {
        position: absolute;
        border: 3px solid var(--primary);
        border-radius: 14px;
        box-shadow: 0 0 0 6px rgba(27, 95, 180, 0.16);
        will-change: transform, opacity;

      .co .lbl {
        position: absolute;
        left: 0;
        white-space: nowrap;
        padding: 8px 16px;
        border-radius: 999px;
        font-size: 20px;
        font-weight: 600;
        background: var(--primary);
        color: #fff;
        box-shadow: 0 8px 24px rgba(27, 95, 180, 0.35);

      .co .lbl.top {
        bottom: calc(100% + 12px);

      .co .lbl.bot {

      /* 右の説明の列 */
      .col {
        position: absolute;
        left: 1304px;
        top: 276px;
        width: 540px;
      }
      .bul {
        display: flex;
        gap: 18px;
        align-items: flex-start;

      }
      .bul .dot {
        flex: 0 0 44px;
        height: 44px;
        border-radius: 14px;

      .bul .tx {

      .note {

      /* ページャー */

      .pager i {

      /* 行き先カード */
      .dest {
        position: absolute;
        width: 400px;
        height: 300px;
        border-radius: 28px;
        background: #fff;

      .dest .ic {

        background: var(--primary-container);
        border-radius: 18px;
        padding: 10px;
      }
      .dest h3 {
        margin: 22px 0 8px;
        font-size: 38px;
        font-weight: 700;

      }
      .dest p {
        margin: 0;
        font-size: 20px;
        line-height: 1.55;
        color: var(--on-surface-variant);
      }

      /* レール */
      .rail {
        position: absolute;
        left: 96px;
        top: 168px;
        width: 104px;
        height: 760px;
        border-radius: 32px;
        background: var(--surface-container);
        will-change: transform, opacity;
      }
      .rail .fab {
        position: absolute;
        left: 24px;
        top: 28px;
        width: 56px;
        height: 56px;
        border-radius: 18px;
        background: var(--primary-container);
        color: var(--on-primary-container);
        display: flex;

      }
      .rail .it {
        position: absolute;
        left: 0;

        will-change: transform, opacity;
      }
      .rail .it .pill {
        width: 56px;
        height: 32px;
        border-radius: 16px;

      .rail .it.on .pill {

      .rail .ring {

      /* チップ（採否） */
      .chip {

      .chip .ic {

      .chip small {

      }

      /* 版のタイムライン */
      .rev {
        position: absolute;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 18px 50px rgba(6, 19, 41, 0.12);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        will-change: transform, opacity;
      }
      .rev b {
        font-size: 44px;
        font-weight: 700;

      }
      .rev span {

      }
      .tag {
        position: absolute;
        padding: 8px 18px;
        border-radius: 999px;
        font-size: 20px;
        font-weight: 600;
        display: flex;
        gap: 8px;
        align-items: center;
        will-change: transform, opacity;
      }
      .tag .ic {
        font-size: 22px;
      }
      .card {
        position: absolute;
        width: 250px;
        padding: 14px 18px;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 10px 30px rgba(6, 19, 41, 0.1);
        font-size: 18px;
        line-height: 1.4;
        display: flex;
        gap: 10px;
        align-items: center;
        will-change: transform, opacity;
      }
      .card .ic {
        font-size: 24px;
        flex: 0 0 auto;
      }
      .card em {
        font-style: normal;
        font-weight: 700;
      }

      /* 校了のチェック */
      .guard {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 26px;
        will-change: transform, opacity;
      }
      .guard svg {
        flex: 0 0 48px;
      }
      .guard .tx {
        font-size: 26px;
        font-weight: 600;
      }
      .guard .tx small {
        display: block;
        font-size: 18px;
        font-weight: 400;
        color: var(--on-surface-variant);

      }
      .stamp {
        position: absolute;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        border: 8px solid var(--primary);
        color: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 86px;
        font-weight: 800;
        letter-spacing: 0.06em;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 0 30px 80px rgba(27, 95, 180, 0.35);
        will-change: transform, opacity;
      }

      /* スマホ */
      .phone {
        position: absolute;
        transform-origin: 50% 0;
        width: 412px;
        height: 915px;
        border-radius: 52px;
        background: #0d1626;
        padding: 14px;
        box-sizing: content-box;
        box-shadow: 0 40px 100px rgba(6, 19, 41, 0.35);
        will-change: transform, opacity;
      }
      .phone .scr {
        width: 412px;
        height: 915px;
        border-radius: 40px;
        overflow: hidden;
        position: relative;
        background: #fff;
      }
      .phone .scr img {
        display: block;
        width: 412px;
        height: 915px;
      }
      .phone .notch {
        position: absolute;
        left: 50%;
        top: 14px;
        transform: translateX(-50%);
        width: 120px;
        height: 34px;
        border-radius: 20px;
        background: #0d1626;
      }

      /* 流れ（最後） */
      .flow {
        position: absolute;
        padding: 18px 34px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        border: 1.5px solid rgba(169, 199, 255, 0.5);
        color: #fff;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.08em;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script>
      /* ---------- 小さなタイムラインのエンジン ---------- */
      const FPS = 60;
      /** 章の開始時刻（秒）。audio.mjs と合わせる */
      const C = {
        s1: 7.4,
        s2: 16.2,
        s3: 30.7,
        s4: 43.9,
        s5: 54.0,
        s6: 66.6,
        s7: 78.0,
        s8: 87.4,
        end: 95,
      };
      const SCENES = [];
      function scene(start, end, root, update) {
        SCENES.push({ start, end, root, update });
      }
      const W = 1920,
        H = 1080;
      const stage = document.getElementById("stage");
      const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      const lerp = (a, b, t) => a + (b - a) * t;
      const E = {
        lin: (t) => t,
        out: (t) => 1 - Math.pow(1 - t, 3),
        outQuint: (t) => 1 - Math.pow(1 - t, 5),
        outExpo: (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
        in: (t) => t * t * t,
        inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
        inOutQuint: (t) => (t < 0.5 ? 16 * t ** 5 : 1 - Math.pow(-2 * t + 2, 5) / 2),
        back: (t) => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
        // M3 expressive の spatial spring 風（約 9% の行き過ぎ）
        spring: (t) => (t >= 1 ? 1 : 1 - Math.exp(-6.5 * t) * Math.cos(7.5 * t)),
        springSoft: (t) => (t >= 1 ? 1 : 1 - Math.exp(-7 * t) * Math.cos(5.2 * t)),
      };
      /** 0..1 の進み具合（start から dur 秒） */
      const P = (t, start, dur, ease = E.out) => ease(clamp((t - start) / dur, 0, 1));
      /** 入って（in）、出る（out）。範囲外は 0 */
      const IO = (t, start, inDur, end, outDur, easeIn = E.out, easeOut = E.in) =>
        Math.min(P(t, start, inDur, easeIn), 1 - P(t, end - outDur, outDur, easeOut));

      const el = (cls, html = "", parent = stage, style = {}) => {
        const d = document.createElement("div");
        d.className = cls;
        d.innerHTML = html;
        Object.assign(d.style, style);
        parent.appendChild(d);
        return d;
      };
      const px = (n) => `${n}px`;
      /** transform/opacity を一度に */
      const set = (e, { x = 0, y = 0, s = 1, sx, sy, r = 0, o = 1, blur } = {}) => {
        e.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${sx ?? s}, ${sy ?? s}) rotate(${r}deg)`;
        e.style.opacity = o;
        if (blur !== undefined) e.style.filter = blur > 0.05 ? `blur(${blur}px)` : "";
      };
      const hide = (e) => (e.style.opacity = 0);

      /** 文字ごとに span に割る（マスクの中で下から上へ現れる） */
      const chars = (e) => {
        const text = e.textContent;
        e.textContent = "";
        const out = [];
        for (const c of text) {
          const m = document.createElement("span");
          m.className = "mask";
          const s = document.createElement("span");
          s.className = "ch";
          s.textContent = c === " " ? " " : c;
          m.appendChild(s);
          e.appendChild(m);
          out.push(s);
        }
        return out;
      };
      const revealChars = (
        spans,
        t,
        start,
        { stagger = 0.028, dur = 0.7, dy = 1.1, ease = E.outQuint, out, outDur = 0.4 } = {},
      ) => {
        spans.forEach((s, i) => {
          let p = P(t, start + i * stagger, dur, ease);
          let o = p;
          if (out !== undefined) {
            const q = P(t, out + i * stagger * 0.4, outDur, E.in);
            o = Math.min(o, 1 - q);
            s.style.transform = `translateY(${(1 - p) * dy * 100 - q * 60}%)`;
          } else s.style.transform = `translateY(${(1 - p) * dy * 100}%)`;
          s.style.opacity = o;
        });
      };
      /** 単語（要素）単位のふわっとした登場 */
      const rise = (
        e,
        t,
        start,
        { dur = 0.8, dy = 40, ease = E.outQuint, out, outDur = 0.45, dyOut = -24, s0 = 1 } = {},
      ) => {
        const p = P(t, start, dur, ease);
        let o = p,
          y = (1 - p) * dy,
          s = lerp(s0, 1, p);
        if (out !== undefined) {
          const q = P(t, out, outDur, E.in);
          o = Math.min(o, 1 - q);
          y += q * dyOut;
        }
        set(e, { y, o, s });
        return p;
      };

      /* ---------- 画面（ブラウザ風の窓） ---------- */
      const IMG = (name) => `../out/screenshots/${name}.png`;
      const makeWin = (
        parent,
        { x, y, w, h, src, mobile = false, url = "MF100 校正システム（デモ）" },
      ) => {
        const win = el(
          "win",
          `<div class="bar"><i></i><i></i><i></i><div class="url">${url}</div></div><div class="view"><div class="cont"><img ${mobile ? 'class="mobile"' : ""} src="${IMG(src)}"></div></div>`,
          parent,
          { left: px(x), top: px(y), width: px(w), height: px(h) },
        );
        const view = win.querySelector(".view");
        const vh = h - 36;
        view.style.height = px(vh);
        const cont = win.querySelector(".cont");
        const img = win.querySelector("img");
        const iw = mobile ? 412 : 1440,
          ih = mobile ? 915 : 900;
        const fitS = w / iw;
        const api = {
          el: win,
          cont,
          img,
          w,
          vh,
          iw,
          ih,
          fitS,
          /** 画像の点 (px, py) を窓の中央に、倍率 s で */
          look(pX, pY, s) {
            const tx = clamp(w / 2 - s * pX, Math.min(0, w - s * iw), 0);
            const ty = clamp(vh / 2 - s * pY, Math.min(0, vh - s * ih), 0);
            cont.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${s})`;
          },
          /** 窓に収める（上端合わせ） */
          fit() {
            api.look(iw / 2, vh / (2 * fitS), fitS);
          },
          /** キーフレーム {t, x, y, s} の列を補間（t は窓のローカル時刻） */
          cam(t, keys, ease = E.inOutQuint) {
            let a = keys[0],
              b = keys[0];
            for (let i = 0; i < keys.length; i++) {
              if (keys[i].t <= t) {
                a = keys[i];
                b = keys[Math.min(i + 1, keys.length - 1)];
              }
            }
            const span = Math.max(0.001, b.t - a.t);
            const p = a === b ? 1 : ease(clamp((t - a.t) / span, 0, 1));
            const f = (k) => (k.fit ? { x: iw / 2, y: vh / (2 * fitS), s: fitS } : k);
            const A = f(a),
              B = f(b);
            api.look(lerp(A.x, B.x, p), lerp(A.y, B.y, p), lerp(A.s, B.s, p));
          },
          /** 画像座標のコールアウト */
          callout({ x, y, w, h, label, pos = "top" }) {
            const c = el("co", label ? `<div class="lbl ${pos}">${label}</div>` : "", cont, {
              left: px(x),
              top: px(y),
              width: px(w),
              height: px(h),
            });
            c.style.transformOrigin = "center";
            hide(c);
            return c;
          },

              s: lerp(0.8, 0.9, pp),
            });
          });
          b.forEach((e, i) => rise(e, t, 1.4 + i * 0.9, { dy: 30, out: out + i * 0.04 }));
          const bp = P(t, 3.6, 0.8, E.spring),
            q = P(t, out, 0.4, E.in);
          set(bell, {
            s: bp,
            o: Math.min(bp, 1 - q),
            r: Math.sin(Math.max(0, t - 4.0) * 14) * 12 * Math.exp(-Math.max(0, t - 4.0) * 2.2),
          });
          const bb = P(t, 4.2, 0.6, E.spring);
          set(badge, { s: bb, o: Math.min(bb, 1 - q) });
          badge.textContent = String(Math.max(1, Math.round(lerp(1, 3, P(t, 4.2, 1.0)))));
          const br = P(t, 4.2, 1.2, E.outExpo);
          set(bring, { s: 1 + br * 1.8, o: t > 4.2 ? (1 - br) * 0.7 : 0 });
        });
      }

      /* =====================================================================
   シーン 8: アウトロ（82.6–90）
   ===================================================================== */
      const s8 = el("scene");
      {
        const cover = el("abs", "", s8, {
          left: px(W / 2 - 60),
          top: px(H / 2 - 60),
          width: "120px",
          height: "120px",
          borderRadius: "50%",
          background: "var(--primary)",
        });
        const steps = ["登録", "提出", "校正", "採否", "次版", "校了"];
        const N = steps.length,
          gap = 262,
          x0 = W / 2 - (gap * (N - 1)) / 2;
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
        Object.assign(svg.style, { position: "absolute", inset: 0, width: px(W), height: px(H) });
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute(
          "d",
          `M ${x0} 470 ${steps.map((_, i) => `L ${x0 + i * gap} 470`).join(" ")}`,
        );
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "rgba(169,199,255,.7)");
        path.setAttribute("stroke-width", "3");
        path.setAttribute("pathLength", "1");
        path.setAttribute("stroke-dasharray", "1");
        svg.appendChild(path);
        s8.appendChild(svg);
        const pills = steps.map((s, i) =>
          el("flow", s, s8, {
            left: px(x0 + i * gap),
            top: "470px",
            transform: "translate(-50%,-50%)",
          }),
        );
        // 「次版 → 校正」の戻り矢印
        const loop = document.createElementNS("http://www.w3.org/2000/svg", "path");
        loop.setAttribute(
          "d",
          `M ${x0 + 4 * gap} 520 C ${x0 + 4 * gap} 620, ${x0 + 2 * gap} 620, ${x0 + 2 * gap} 520`,
        );
        loop.setAttribute("fill", "none");
        loop.setAttribute("stroke", "rgba(169,199,255,.55)");
        loop.setAttribute("stroke-width", "2.5");
        loop.setAttribute("stroke-dasharray", "1");
        loop.setAttribute("pathLength", "1");
        loop.setAttribute("marker-end", "");
        svg.appendChild(loop);
        const loopLbl = el("abs", "直して、次の版へ", s8, {
          left: 0,
          right: 0,
          top: "628px",
          textAlign: "center",
          fontSize: "20px",
          color: "rgba(169,199,255,.9)",
          letterSpacing: ".1em",
        });
        const tag = el("abs", "判断と責任が、追える。", s8, {
          left: 0,
          right: 0,
          top: "250px",
          textAlign: "center",
          fontSize: "64px",
          fontWeight: "700",
          color: "#fff",
          letterSpacing: ".05em",
        });
        const tagC = chars(tag);
        const brand = el(
          "abs",
          'MF100 校正システム <span style="font-weight:300;color:#a9c7ff;letter-spacing:.3em;margin-left:.6em">refine</span>',
          s8,
          {
            left: 0,
            right: 0,
            top: "790px",
            textAlign: "center",
            fontSize: "36px",
            fontWeight: "600",
            color: "#fff",
            letterSpacing: ".08em",
          },
        );
        const foot = el(
          "abs",
          "要件の正本 docs/REQUIREMENTS.md v1.1 ・ Material 3 Expressive ・ Web / PWA ・ Convex + Cloudflare",
          s8,
          {
            left: 0,
            right: 0,
            top: "860px",
            textAlign: "center",
            fontSize: "18px",
            color: "rgba(169,199,255,.7)",
            letterSpacing: ".12em",
          },
        );
        const black = el("abs", "", s8, { inset: 0, background: "#000" });
        scene(C.s8, C.end, s8, (t, g) => {
          drawBg(g, 0);
          const wp = P(t, 0, 1.0, E.inOutQuint);
          set(cover, { s: wp * 24, o: 1 - P(t, 0.95, 0.5, E.inOut) });
          pills.forEach((p, i) => {
            const q = P(t, 1.2 + i * 0.16, 0.8, E.spring);
            p.style.opacity = q;
            p.style.transform = `translate(-50%,-50%) scale(${lerp(0.6, 1, q)})`;
          });
          path.style.strokeDashoffset = 1 - P(t, 1.3, 1.4, E.inOutQuint);
          loop.style.strokeDashoffset = 1 - P(t, 2.6, 0.9, E.inOut);
          rise(loopLbl, t, 3.0, { dy: 10 });
          revealChars(tagC, t, 2.2, { stagger: 0.04 });
          rise(brand, t, 3.6, { dy: 16 });
          rise(foot, t, 4.0, { dy: 10 });
          black.style.opacity = P(t, C.end - C.s8 - 1.1, 0.9, E.inOut);
        });
      }

      /* ---------- 組み立て ---------- */
      const DURATION = C.end;
      window.__duration = DURATION;
      window.__seek = (t) => {
        for (const s of SCENES) {
          const on = t >= s.start && t < s.end;
          s.root.style.visibility = on ? "visible" : "hidden";
          if (on) s.update(t - s.start, t);
        }
        const dark = t < C.s1 + 0.2 || t >= C.s8 + 0.4;
        drawPager(t, dark);
      };
      // 素材とフォントがそろったら true
      window.__ready = (async () => {
        await document.fonts.ready;
        await Promise.all(
          [
            '400 24px "Noto Sans JP Variable"',
            '700 24px "Noto Sans JP Variable"',
            '200 24px "Noto Sans JP Variable"',
            '400 24px "Material Symbols Outlined Variable"',
          ].map((f) => document.fonts.load(f)),
        );
        await Promise.all(
          [...document.images].map((i) =>
            i.complete
              ? Promise.resolve()
              : new Promise((r) => {
                  i.onload = r;
                  i.onerror = r;
                }),
          ),
        );
        return true;
      })();

      const q = new URLSearchParams(location.search);
      if (q.has("play")) {
        const t0 = performance.now() - parseFloat(q.get("t") || "0") * 1000;
        const loop = () => {
          window.__seek(((performance.now() - t0) / 1000) % DURATION);
          requestAnimationFrame(loop);
        };
        window.__ready.then(loop);
      } else {
        window.__ready.then(() => window.__seek(parseFloat(q.get("t") || "0")));
      }
    </script>
  </body>
</html>
