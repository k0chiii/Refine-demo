<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f9f9ff" />
    <title>MF100 校正システム</title>
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <!--
      m3e-theme は <body> の直下に置く。直下にあるときだけ M3E はテーマ変数（--md-sys-color-*）を
      html に、フォント・背景色を body に適用する（それ以外は m3e-theme 自身の shadow に閉じる）。
      React のルートはその内側。設定値は src/theme.ts で登録・更新する。
    -->
    <m3e-theme color="#1b5fb4" variant="expressive" scheme="light" motion="expressive" strong-focus>
      <div id="root"></div>
    </m3e-theme>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
