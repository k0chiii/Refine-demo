# CI: 変更ごとに、手元で回しているのと同じ確認を走らせる（CLAUDE.md: pnpm check / pnpm test / pnpm typecheck）。
# 方針は docs/TESTING_AGENT_POLICY.md、時間の内訳は docs/CI_CD.md。
# - verify-* : 整形・lint、型、単体テスト、codegen 差分を並列。集約ジョブ verify が必須チェック用。
# - PR の単体は pnpm test。main / 手動は pnpm test:coverage（成果物）。
# - e2e-smoke（PR）: 各ジョブ内でデモ版をビルドしてから @smoke と PWA。
# - e2e（main・手動）: 全 spec を shard。visual: screenshots.mjs（部ごと）と a11y。
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHROMIUM_PATH: /usr/bin/google-chrome
  TZ: Asia/Tokyo

jobs:
  verify-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@56918a6d0c629c55ae8b88826a7d47fda85769ee # v1.9.0
        with:
          version: "1.2.0"
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - uses: actions/cache@v4
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}-${{ github.sha }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}-
      - name: ビルド
        run: pnpm build
      - name: 整形と lint
        run: pnpm check

  verify-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@56918a6d0c629c55ae8b88826a7d47fda85769ee # v1.9.0
        with:
          version: "1.2.0"
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - uses: actions/cache@v4
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}-${{ github.sha }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}-
      - name: ビルド
        run: pnpm build
      - name: 型
        run: pnpm typecheck
      - name: Worker の生成型とバックアップ検証ツール
        run: |
          pnpm --filter @mf100/api types:check
          python3 -B scripts/test_verify_backup.py

  verify-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@56918a6d0c629c55ae8b88826a7d47fda85769ee # v1.9.0
        with:
          version: "1.2.0"
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - uses: actions/cache@v4
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}-${{ github.sha }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}-
      - name: ビルド
        run: pnpm build
      - name: 単体テスト（PR は coverage なし）
        if: github.event_name == 'pull_request'
        run: pnpm test
      - name: 単体テスト（coverage）
        if: github.event_name != 'pull_request'
        run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: unit-coverage
          path: coverage
          retention-days: 7

  verify-codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@56918a6d0c629c55ae8b88826a7d47fda85769ee # v1.9.0
        with:
          version: "1.2.0"
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - uses: actions/cache@v4
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}-${{ github.sha }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}-
      - name: Convex の _generated がコミットと一致するか
        run: |
          pnpm codegen
          git diff --exit-code -- apps/convex/convex/_generated

  # ブランチ保護の必須チェック名を verify のまま使えるようにする集約ジョブ
  verify:
    needs: [verify-check, verify-typecheck, verify-test, verify-codegen]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: verify レーンがすべて成功したか
        run: |
          echo "check=${{ needs.verify-check.result }}"
          echo "typecheck=${{ needs.verify-typecheck.result }}"
          echo "test=${{ needs.verify-test.result }}"
          echo "codegen=${{ needs.verify-codegen.result }}"
          test "${{ needs.verify-check.result }}" = success
          test "${{ needs.verify-typecheck.result }}" = success
          test "${{ needs.verify-test.result }}" = success
          test "${{ needs.verify-codegen.result }}" = success

  e2e-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@56918a6d0c629c55ae8b88826a7d47fda85769ee # v1.9.0
        with:
          version: "1.2.0"
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - name: デモ版をビルド
        run: pnpm --filter @mf100/web build:demo
      - name: 主要な流れ（@smoke）
        working-directory: apps/web
        env:
          E2E_PREBUILT: "1"
        run: pnpm exec playwright test --grep @smoke --reporter=github,list,html
      - name: PWA
        working-directory: apps/web
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          pnpm exec vp preview --mode demo --outDir dist-demo --port 4173 --host 127.0.0.1 > preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null "$BASE_URL/" && break; sleep 1; done
          node e2e/pwa.mjs
      - name: 報告と失敗の trace を残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke
          path: |
            apps/web/playwright-report
            apps/web/e2e/out
            apps/web/preview.log
          retention-days: 14

  e2e:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@56918a6d0c629c55ae8b88826a7d47fda85769ee # v1.9.0
        with:
          version: "1.2.0"
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - name: デモ版をビルド
        run: pnpm --filter @mf100/web build:demo
      - name: 機能の E2E（全 spec・1 ジョブで並列。shard の偏りを避ける）
        working-directory: apps/web
        env:
          E2E_PREBUILT: "1"
        run: pnpm exec playwright test --reporter=github,list,html
      - name: 報告（失敗の trace 入り）を残す
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: apps/web/playwright-report
          retention-days: 14

  visual:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [core, compact, v2, web]
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@56918a6d0c629c55ae8b88826a7d47fda85769ee # v1.9.0
        with:
          version: "1.2.0"
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - name: デモ版をビルド
        run: pnpm --filter @mf100/web build:demo
      - name: 画面の撮影・操作の検証・a11y（区間計測は実行のまとめへ）
        working-directory: apps/web
        env:
          BASE_URL: http://127.0.0.1:4173
          E2E_PART: ${{ matrix.part }}
        run: |
          pnpm exec vp preview --mode demo --outDir dist-demo --port 4173 --host 127.0.0.1 > preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null "$BASE_URL/" && break; sleep 1; done
          A11Y=1 node e2e/screenshots.mjs
      - name: PWA
        if: matrix.part == 'web'
        working-directory: apps/web
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node e2e/pwa.mjs
      - name: 撮影した画面・a11y の結果・区間計測を残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-${{ matrix.part }}
          path: |
            apps/web/e2e/out
            apps/web/preview.log
          retention-days: 14
